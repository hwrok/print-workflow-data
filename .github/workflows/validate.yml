name: validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: print workflow data (uses self)
        uses: ./

      # see packageManager in package.json
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: pnpm install
        id: install-deps
        run: pnpm install

      - name: check - tests
        if: always() && steps.install-deps.outcome == 'success'
        run: pnpm test

      - name: check - formatting
        if: always() && steps.install-deps.outcome == 'success'
        run: pnpm format

      - name: check - spelling
        if: always() && steps.install-deps.outcome == 'success'
        run: pnpm spellcheck

      - name: check - workflows
        if: always() && steps.install-deps.outcome == 'success'
        run: pnpm lint:actions

  runner-smoke:
    name: runner smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: print workflow data (uses self)
        uses: ./

      # ref: action.yml env
      - name: runner smoke
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SECRET_SOURCE: ${{ github.secret_source }}
          JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MATRIX_CONTEXT: ${{ toJSON(matrix) }}
          STRATEGY_CONTEXT: ${{ toJSON(strategy) }}
          JOB_CONTEXT: ${{ toJSON(job) }}
          RUNNER_CONTEXT: ${{ toJSON(runner) }}
          CALLER_INPUTS: ${{ toJSON(inputs) }}
          CALLER_NEEDS: 'n/a'
          CALLER_VARS: 'n/a'
          EXTRAS: '{"msg":"100% 👨‍👩‍👧‍👦 #!@ -n"}'
        run: bash tests/runner-smoke.sh

  # breaks action.sh on purpose and runs it like a consumer would - the job must survive
  never-breaks-consumer:
    name: never breaks consumer (${{ matrix.sabotage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sabotage: [exit-1, missing, syntax-error, not-executable]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: sabotage action.sh
        env:
          MODE: ${{ matrix.sabotage }}
        run: |
          case "$MODE" in
            exit-1) printf '#!/usr/bin/env bash\nexit 1\n' > action.sh ;;
            missing) rm action.sh ;;
            syntax-error) printf '#!/usr/bin/env bash\nif then fi\n' > action.sh ;;
            not-executable) chmod -x action.sh ;;
            *) echo "::error::unknown sabotage mode: $MODE"; exit 1 ;;
          esac

      - name: run sabotaged action
        id: action
        uses: ./

      - name: assert consumer job kept going
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: test "$OUTCOME" = success
